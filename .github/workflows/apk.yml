name: Compilar APK

# Arma la app Android (Capacitor + Bluetooth nativo) a partir de index.html
# y la deja para descargar en "Releases" como estacion-movil.apk

on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # La misma firma en todas las compilaciones, para poder actualizar la app sin desinstalarla.
      # La primera vez se crea y se guarda en la carpeta "firma" del repositorio.
      - name: Firma del APK
        run: |
          mkdir -p ~/.android
          if [ -f firma/debug.keystore ]; then
            cp firma/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p firma
            cp ~/.android/debug.keystore firma/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add firma/debug.keystore
            git commit -m "Firma fija para el APK"
            git push
          fi

      - name: Armar el proyecto Capacitor
        run: |
          mkdir -p build/www
          cp index.html build/www/
          if [ -f sw.js ]; then cp sw.js build/www/; fi
          cd build
          echo '{"name":"estacion-movil","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-community/bluetooth-le@8 @capawesome-team/capacitor-android-foreground-service@8 @capacitor/geolocation@8
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          echo '{"appId":"ar.estacion.movil","appName":"Estación Móvil","webDir":"www"}' > capacitor.config.json
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i '0,/<manifest /s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s" />\n</manifest>#' $M
          # Código nativo propio: alarma hablada por el canal de alarmas + notificación de alarmas
          J=android/app/src/main/java/ar/estacion/movil
          cat > $J/AlarmaVozPlugin.java <<'JAVA'
          package ar.estacion.movil;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Handler;
          import android.os.VibrationEffect;
          import android.provider.Settings;
          import android.os.Vibrator;
          import com.getcapacitor.JSArray;
          import android.os.Looper;
          import android.speech.tts.TextToSpeech;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.Locale;

          // Alarma hablada por el canal de ALARMAS del teléfono (suena con el volumen de alarmas, como el reloj,
          // aunque el volumen multimedia esté bajo) y notificación destacada de alarmas.
          @CapacitorPlugin(name = "AlarmaVoz")
          public class AlarmaVozPlugin extends Plugin {

              private TextToSpeech tts;
              private boolean ttsListo = false;

              @Override
              public void load() {
                  tts = new TextToSpeech(getContext(), status -> {
                      if (status == TextToSpeech.SUCCESS && tts != null) {
                          tts.setAudioAttributes(
                              new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          );
                          int r = tts.setLanguage(new Locale("es", "AR"));
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts.setLanguage(new Locale("es"));
                          }
                          tts.setSpeechRate(0.95f);
                          ttsListo = true;
                      }
                  });
              }

              @PluginMethod
              public void hablar(final PluginCall call) {
                  final String texto = call.getString("texto", "");
                  final int repeticiones = Math.max(1, Math.min(5, call.getInt("repeticiones", 2)));
                  final Handler principal = new Handler(Looper.getMainLooper());
                  // Tres segundos de tono de aviso por el canal de alarmas, y después la frase
                  try {
                      final ToneGenerator tono = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                      tono.startTone(ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK, 1500);
                      principal.postDelayed(tono::release, 1900);
                  } catch (Exception e) {
                      // sin tono: se sigue con la voz
                  }
                  principal.postDelayed(
                      () -> {
                          if (!ttsListo || tts == null) {
                              call.reject("La voz del teléfono no está disponible (falta el motor de texto a voz en español)");
                              return;
                          }
                          for (int i = 0; i < repeticiones; i++) {
                              tts.speak(texto, i == 0 ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD, null, "alarma" + i);
                              if (i < repeticiones - 1) {
                                  tts.playSilentUtterance(700, TextToSpeech.QUEUE_ADD, "pausa" + i);
                              }
                          }
                          call.resolve();
                      },
                      1700
                  );
              }

              @PluginMethod
              public void notificar(PluginCall call) {
                  String titulo = call.getString("titulo", "Alarma");
                  String texto = call.getString("texto", "");
                  try {
                      Context ctx = getContext();
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel canal = new NotificationChannel("alarmas", "Alarmas meteorológicas", NotificationManager.IMPORTANCE_HIGH);
                          canal.enableVibration(true);
                          canal.setVibrationPattern(new long[] {0, 300, 150, 300});
                          nm.createNotificationChannel(canal);
                          b = new Notification.Builder(ctx, "alarmas");
                      } else {
                          b = new Notification.Builder(ctx);
                          b.setPriority(Notification.PRIORITY_HIGH);
                          b.setDefaults(Notification.DEFAULT_ALL);
                      }
                      int icono = ctx.getResources().getIdentifier("ic_estacion", "drawable", ctx.getPackageName());
                      if (icono == 0) {
                          icono = android.R.drawable.ic_dialog_alert;
                      }
                      Intent abrir = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                      PendingIntent alTocar = PendingIntent.getActivity(ctx, 0, abrir, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      b.setSmallIcon(icono)
                          .setContentTitle(titulo)
                          .setContentText(texto)
                          .setStyle(new Notification.BigTextStyle().bigText(texto))
                          .setAutoCancel(true)
                          .setContentIntent(alTocar);
                      nm.notify(7002, b.build());
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("No se pudo mostrar la notificación: " + e.getMessage());
                  }
              }

              // Vibración por el canal de ALARMAS: vibra aunque la opción "vibrar" del teléfono esté desmarcada
              // (la vibración de alarma no depende de esa opción, como la del reloj despertador)
              @PluginMethod
              public void vibrar(PluginCall call) {
                  try {
                      JSArray arr = call.getArray("patron");
                      long[] p;
                      if (arr == null || arr.length() == 0) {
                          p = new long[] {0, 500, 200, 500, 200, 500};
                      } else {
                          p = new long[arr.length() + 1];
                          p[0] = 0;
                          for (int i = 0; i < arr.length(); i++) {
                              p[i + 1] = arr.getLong(i);
                          }
                      }
                      Vibrator v = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null || !v.hasVibrator()) {
                          call.reject("Este teléfono no tiene vibrador");
                          return;
                      }
                      AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createWaveform(p, -1), aa);
                      } else {
                          v.vibrate(p, -1, aa);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("No se pudo vibrar: " + e.getMessage());
                  }
              }

              // Abre los ajustes de ubicación del teléfono para encender el GPS
              @PluginMethod
              public void abrirUbicacion(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("No se pudo abrir los ajustes de ubicación: " + e.getMessage());
                  }
              }

              @Override
              protected void handleOnDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }
              }
          }
          JAVA
          cat > $J/MainActivity.java <<'JAVA'
          package ar.estacion.movil;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmaVozPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          # Servicio permanente (segundo plano): permisos, servicio y su ícono de notificación
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $M
          sed -i 's#</application>#        <receiver android:name="io.capawesome.capacitorjs.plugins.foregroundservice.NotificationActionBroadcastReceiver" />\n        <service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="connectedDevice|location" />\n    </application>#' $M
          mkdir -p android/app/src/main/res/drawable
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M15,13V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v8c-1.21,0.91 -2,2.37 -2,4 0,2.76 2.24,5 5,5s5,-2.24 5,-5c0,-1.63 -0.79,-3.09 -2,-4zM11,5c0,-0.55 0.45,-1 1,-1s1,0.45 1,1v6h-2V5z"/></vector>' > android/app/src/main/res/drawable/ic_estacion.xml
          # Ícono de la app: foto del barógrafo (icono.png del repositorio); si falta, barómetro dibujado
          R=android/app/src/main/res
          echo "ICONO: archivos en la carpeta principal del repositorio:"; ls -1 .. | grep -v '^build$' | tr '\n' ' '; echo
          ICO=$(find .. -maxdepth 3 -type f -iname 'icono*.png' -not -path '../build/*' -not -path '../.git/*' | head -1)
          if [ -n "$ICO" ]; then
            echo "ICONO: se usa $ICO ($(stat -c%s "$ICO") bytes)"
            mkdir -p $R/drawable-nodpi
            cp "$ICO" $R/drawable-nodpi/ic_lanzador.png
          else
            echo "ICONO: NO se encontro icono.png en la carpeta principal del repositorio; se usa el barometro dibujado"
            echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#6B4A12" android:pathData="M23,54a31,31 0 1,0 62,0a31,31 0 1,0 -62,0z"/><path android:fillColor="#E2BC5A" android:pathData="M24.5,54a29.5,29.5 0 1,0 59.0,0a29.5,29.5 0 1,0 -59.0,0z"/><path android:fillColor="#C9973A" android:pathData="M27,54a27,27 0 1,0 54,0a27,27 0 1,0 -54,0z"/><path android:fillColor="#3A2614" android:pathData="M28.8,54a25.2,25.2 0 1,0 50.4,0a25.2,25.2 0 1,0 -50.4,0z"/><path android:fillColor="#F8F1DC" android:pathData="M29.8,54a24.2,24.2 0 1,0 48.4,0a24.2,24.2 0 1,0 -48.4,0z"/><path android:strokeColor="#4F7A8C" android:strokeWidth="3.4" android:pathData="M40.21,67.79A19.5,19.5 0 0,1 39.74,40.70"/><path android:strokeColor="#3F6B3A" android:strokeWidth="3.4" android:pathData="M40.70,39.74A19.5,19.5 0 0,1 67.30,39.74"/><path android:strokeColor="#C0503A" android:strokeWidth="3.4" android:pathData="M68.26,40.70A19.5,19.5 0 0,1 67.79,67.79"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M45.16,62.84L42.69,65.31"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M41.50,54.00L38.00,54.00"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M45.16,45.16L42.69,42.69"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M54.00,41.50L54.00,38.00"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M62.84,45.16L65.31,42.69"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M66.50,54.00L70.00,54.00"/><path android:strokeColor="#2A1D12" android:strokeWidth="1.5" android:pathData="M62.84,62.84L65.31,65.31"/><path android:fillColor="#1A120B" android:pathData="M66.93,37.45L55.73,55.35L49.69,59.52L52.27,52.65z"/><path android:fillColor="#C9973A" android:pathData="M50.6,54a3.4,3.4 0 1,0 6.8,0a3.4,3.4 0 1,0 -6.8,0z"/><path android:fillColor="#3A2614" android:pathData="M52.7,54a1.3,1.3 0 1,0 2.6,0a1.3,1.3 0 1,0 -2.6,0z"/></vector>' > $R/drawable/ic_lanzador.xml
          fi
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_lanzador"/></adaptive-icon>' > $R/mipmap-anydpi-v26/ic_launcher.xml
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#4A301C</color></resources>' > $R/values/ic_launcher_background.xml
          echo "ICONO: archivos de icono generados:"; ls -la $R/drawable-nodpi $R/drawable $R/mipmap-anydpi-v26 2>/dev/null | grep -i "lanzador\|launcher" || true
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          npx cap sync android

      - name: Compilar
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../estacion-movil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: estacion-movil-apk
          path: estacion-movil.apk

      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          sleep 3
          gh release create apk estacion-movil.apk --title "Estación Móvil (APK)" --notes "Compilación N° ${{ github.run_number }}. Descargá estacion-movil.apk desde el teléfono e instalalo."
