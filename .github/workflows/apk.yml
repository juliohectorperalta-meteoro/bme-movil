      
name: Compilar APK

# Arma la app Android (Capacitor + Bluetooth nativo) a partir de index.html
# y la deja para descargar en "Releases" como estacion-movil.apk

on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # La misma firma en todas las compilaciones, para poder actualizar la app sin desinstalarla.
      # La primera vez se crea y se guarda en la carpeta "firma" del repositorio.
      - name: Firma del APK
        run: |
          mkdir -p ~/.android
          if [ -f firma/debug.keystore ]; then
            cp firma/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p firma
            cp ~/.android/debug.keystore firma/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add firma/debug.keystore
            git commit -m "Firma fija para el APK"
            git push
          fi

      - name: Armar el proyecto Capacitor
        run: |
          mkdir -p build/www
          cp index.html build/www/
          if [ -f sw.js ]; then cp sw.js build/www/; fi
          cd build
          echo '{"name":"estacion-movil","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-community/bluetooth-le@8 @capawesome-team/capacitor-android-foreground-service@8
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          echo '{"appId":"ar.estacion.movil","appName":"Estación Móvil","webDir":"www"}' > capacitor.config.json
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i '0,/<manifest /s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s" />\n</manifest>#' $M
          # Servicio permanente (segundo plano): permisos, servicio y su ícono de notificación
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' $M
          sed -i 's#</application>#        <receiver android:name="io.capawesome.capacitorjs.plugins.foregroundservice.NotificationActionBroadcastReceiver" />\n        <service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="connectedDevice" />\n    </application>#' $M
          mkdir -p android/app/src/main/res/drawable
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M15,13V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v8c-1.21,0.91 -2,2.37 -2,4 0,2.76 2.24,5 5,5s5,-2.24 5,-5c0,-1.63 -0.79,-3.09 -2,-4zM11,5c0,-0.55 0.45,-1 1,-1s1,0.45 1,1v6h-2V5z"/></vector>' > android/app/src/main/res/drawable/ic_estacion.xml
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          npx cap sync android

      - name: Compilar
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../estacion-movil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: estacion-movil-apk
          path: estacion-movil.apk

      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          sleep 3
          gh release create apk estacion-movil.apk --title "Estación Móvil (APK)" --notes "Compilación N° ${{ github.run_number }}. Descargá estacion-movil.apk desde el teléfono e instalalo."
